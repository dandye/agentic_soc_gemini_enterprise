[tool.pyink]
# Pyink is Google's fork of Black, designed for Google Python Style Guide
line-length = 88
target-version = ["py312"]
extend-exclude = '''
/(
  # Exclude common directories
  \.git
  | \.venv
  | venv
  | \.eggs
  | \.tox
  | build
  | dist
  | __pycache__
)/
'''

[tool.mypy]
# Type checking configuration for security-critical code
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
# Allow untyped imports for libraries without stubs
ignore_missing_imports = true
exclude = [
  "^build/",
  "^dist/",
  "^\\.venv/",
  "^\\.eggs/",
  "^\\.tox/"
]

[tool.pytest.ini_options]
# Pytest configuration
minversion = "6.0"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
  "--verbose",
  "--cov=agent_soc_manager",
  "--cov=installation_scripts",
  "--cov-report=term-missing",
  "--cov-report=html",
  "--cov-report=xml",
  "--cov-fail-under=0"
]
# No testpaths specified - will search current directory
# Remove testpaths until tests directory is created

[tool.ruff]
# Ruff is a fast Python linter (replaces isort, bandit, flake8, pylint)
line-length = 88
target-version = "py312"
exclude = [
  ".git",
  ".venv",
  "venv",
  ".eggs",
  ".tox",
  "build",
  "dist",
  "__pycache__"
]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "S",    # bandit security checks
]
ignore = [
  "E501",  # line too long (handled by pyink)
  "S113",  # requests timeout - TODO: add timeouts in future PR
  "S107",  # hardcoded password - false positives on "token_uri" etc
  "B904",  # raise from within except - allow for cleaner error messages
  "B007",  # unused loop variable - common pattern in os.walk
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # Allow assert in tests
"agent_soc_manager/tools/chatops/test_*.py" = ["S101", "S105", "E402"]  # test secrets and post-bootstrap imports
"agent_soc_manager/tools/chatops/generate_test_url.py" = ["S105", "E402"]
"agent_soc_manager/tools/chatops/webhook_handler.py" = ["S104"]
"agent_soc_manager/tools/chatops/chat_app_handler.py" = ["S104"]
"installation_scripts/*.py" = [
  "S603",  # subprocess calls are trusted (gcloud CLI)
  "S607",  # partial executable paths are acceptable (gcloud in PATH)
]

[tool.ruff.lint.isort]
# Configure ruff's isort to use Google style
force-single-line = false
force-sort-within-sections = false
lines-after-imports = 2
