name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'requirements-docs.txt'
      - 'scripts/verify_docs_accessibility.py'
      - 'tests/test_sphinx_transforms.py'
      - '.github/workflows/deploy-docs.yaml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'docs/**'
      - 'requirements-docs.txt'
      - 'scripts/verify_docs_accessibility.py'
      - 'tests/test_sphinx_transforms.py'
      - '.github/workflows/deploy-docs.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    name: Build & Audit WCAG 2.1 AA Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-docs.txt

      - name: Install pinned documentation and audit dependencies
        run: |
          python -m pip install --upgrade pip==25.0.1
          python -m pip install -r requirements-docs.txt
          python -m pip install pytest==9.0.2 playwright==1.64.1 axe-playwright-python==0.1.8
          python -m playwright install --with-deps chromium

      - name: Run Sphinx transform unit tests
        run: |
          python -m pytest -o addopts="" tests/test_sphinx_transforms.py

      - name: Build Sphinx documentation (warnings as errors)
        run: |
          python -m sphinx -W --keep-going -b html docs docs/_build/html
          touch docs/_build/html/.nojekyll

      - name: Verify WCAG 2.1 Level AA accessibility (dark & light themes)
        run: |
          python scripts/verify_docs_accessibility.py --html-dir docs/_build/html

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build-docs
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
